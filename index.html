<!DOCTYPE html>
<html lang="cs" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#6366f1',
                        dark: '#0f172a',
                        darker: '#020617',
                        surface: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-dark text-gray-300 font-sans antialiased overflow-x-hidden" x-data="portfolioData()" x-init="fetchData()">

    <nav class="fixed w-full z-50 bg-dark/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="text-2xl font-bold text-white tracking-wider w-40">DEV<span class="text-primary">.PORTFOLIO</span></div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-1">
                        <template x-for="(label, key) in lang[currentLang].nav">
                            <a :href="'#' + key" class="hover:text-primary px-3 py-2 rounded-md text-sm font-medium transition text-center min-w-[80px]" x-text="label"></a>
                        </template>
                    </div>
                </div>
                <button @click="toggleLang()" class="flex items-center justify-center gap-2 border border-gray-700 w-20 py-1 rounded-full hover:bg-gray-800 transition">
                    <i class="fa-solid fa-globe"></i>
                    <span x-text="currentLang.toUpperCase()" class="font-bold w-4"></span>
                </button>
            </div>
        </div>
    </nav>

    <section id="home" class="min-h-screen flex items-center justify-center pt-16 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-primary/20 via-dark to-dark pointer-events-none"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col-reverse lg:flex-row items-center gap-12 relative z-10">
            <div class="lg:w-1/2 text-center lg:text-left" data-aos="fade-right">
                <h2 class="text-primary font-semibold tracking-wide uppercase mb-2" x-text="lang[currentLang].hero.greeting"></h2>
                <h1 class="text-4xl md:text-6xl font-bold text-white mb-6 leading-tight min-h-[1.2em]">
                    <span x-text="lang[currentLang].hero.role"></span>
                </h1>
                <p class="text-lg text-gray-400 mb-8 max-w-lg mx-auto lg:mx-0 min-h-[80px]" x-text="lang[currentLang].hero.desc"></p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                    <a href="#projects" class="bg-primary hover:bg-indigo-500 text-white px-8 py-3 rounded-lg font-semibold transition shadow-lg shadow-primary/25 text-center w-40" x-text="lang[currentLang].hero.cta_projects"></a>
                    <a href="#contact" class="border border-gray-600 hover:border-white text-white px-8 py-3 rounded-lg font-semibold transition text-center w-40" x-text="lang[currentLang].hero.cta_contact"></a>
                </div>
            </div>
            <div class="lg:w-1/2 flex justify-center" data-aos="fade-left">
                <div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full border-4 border-primary/30 p-2 shadow-2xl shadow-primary/20">
                    <img src="https://via.placeholder.com/400" alt="Profile" class="w-full h-full object-cover rounded-full grayscale hover:grayscale-0 transition duration-500">
                </div>
            </div>
        </div>
    </section>

    <section id="skills" class="py-20 bg-darker">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-3xl font-bold text-white text-center mb-16" x-text="lang[currentLang].titles.skills"></h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-8 text-center">
                <template x-for="skill in skills" :key="skill.name">
                    <div class="p-6 bg-surface rounded-xl hover:bg-gray-700 transition transform hover:-translate-y-2 border border-gray-800" data-aos="zoom-in">
                        <i :class="skill.icon" class="text-4xl text-primary mb-4"></i>
                        <h3 class="text-xl font-semibold text-white" x-text="skill.name"></h3>
                        <p class="text-sm text-gray-400 mt-2" x-text="skill.level"></p>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <section id="pricing" class="py-20 bg-dark">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-3xl font-bold text-white text-center mb-16" x-text="lang[currentLang].titles.pricing"></h2>
            <div class="grid md:grid-cols-3 gap-8">
                <template x-for="plan in lang[currentLang].pricing" :key="plan.title">
                    <div class="bg-surface p-8 rounded-2xl border border-gray-800 hover:border-primary transition relative overflow-hidden group" data-aos="fade-up">
                        <div class="absolute top-0 left-0 w-full h-1 bg-primary transform scale-x-0 group-hover:scale-x-100 transition duration-500"></div>
                        <h3 class="text-2xl font-bold text-white mb-4" x-text="plan.title"></h3>
                        <div class="text-4xl font-bold text-primary mb-6" x-text="plan.price"></div>
                        <ul class="space-y-3 text-gray-400 mb-8 min-h-[100px]">
                            <template x-for="feature in plan.features">
                                <li class="flex items-center gap-2">
                                    <i class="fa-solid fa-check text-green-500 text-sm"></i>
                                    <span x-text="feature"></span>
                                </li>
                            </template>
                        </ul>
                        <a href="#contact" class="block text-center w-full py-3 rounded-lg border border-primary text-primary hover:bg-primary hover:text-white transition font-semibold">Vybrat</a>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <section id="projects" class="py-20 bg-darker">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-3xl font-bold text-white text-center mb-10" x-text="lang[currentLang].titles.projects"></h2>
            
            <div class="flex justify-center gap-4 mb-12 flex-wrap">
                <button @click="activeTab = 'web'" :class="activeTab === 'web' ? 'bg-primary text-white' : 'bg-surface text-gray-400 hover:bg-gray-700'" class="w-32 py-2 rounded-full transition font-medium text-center">Web</button>
                <button @click="activeTab = 'csharp'" :class="activeTab === 'csharp' ? 'bg-primary text-white' : 'bg-surface text-gray-400 hover:bg-gray-700'" class="w-32 py-2 rounded-full transition font-medium text-center">C#</button>
                <button @click="activeTab = 'python'" :class="activeTab === 'python' ? 'bg-primary text-white' : 'bg-surface text-gray-400 hover:bg-gray-700'" class="w-32 py-2 rounded-full transition font-medium text-center">Python</button>
            </div>

            <div x-show="projects.length === 0" class="text-center text-gray-500">Načítám projekty...</div>

            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                <template x-for="project in projects.filter(p => p.category === activeTab)" :key="project.id">
                    <div class="bg-surface rounded-xl overflow-hidden border border-gray-800 hover:shadow-2xl hover:shadow-primary/10 transition group" data-aos="fade-up">
                        <div class="relative h-48 overflow-hidden">
                            <img :src="project.image" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-4">
                                <a :href="project.link" target="_blank" class="p-3 bg-white text-black rounded-full hover:bg-primary hover:text-white transition"><i class="fa-solid fa-external-link-alt"></i></a>
                            </div>
                        </div>
                        <div class="p-6">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-xl font-bold text-white truncate w-full" x-text="project.title[currentLang]"></h3>
                                <span class="bg-gray-700 text-xs px-2 py-1 rounded text-gray-300 ml-2" x-text="project.year"></span>
                            </div>
                            <p class="text-gray-400 text-sm mb-4 line-clamp-2 min-h-[40px]" x-text="project.desc[currentLang]"></p>
                            <button @click="openModal(project)" class="text-primary text-sm font-semibold hover:underline flex items-center gap-1">
                                <span x-text="lang[currentLang].general.details"></span> <i class="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <section class="py-20 bg-dark">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-3xl font-bold text-white text-center mb-16" x-text="lang[currentLang].titles.reviews"></h2>
            <div class="grid md:grid-cols-2 gap-8">
                <template x-for="review in reviews" :key="review.author">
                    <div class="bg-surface p-8 rounded-xl border border-gray-800 relative" data-aos="fade-up">
                        <i class="fa-solid fa-quote-right absolute top-6 right-6 text-gray-700 text-4xl"></i>
                        <p class="text-gray-300 mb-6 italic min-h-[60px]" x-text="review.text[currentLang]"></p>
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-bold" x-text="review.author[0]"></div>
                            <div>
                                <h4 class="font-bold text-white" x-text="review.author"></h4>
                                <span class="text-sm text-gray-500" x-text="review.position"></span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <section id="contact" class="py-20 bg-darker">
        <div class="max-w-3xl mx-auto px-4">
            <h2 class="text-3xl font-bold text-white text-center mb-4" x-text="lang[currentLang].titles.contact"></h2>
            <p class="text-center text-gray-400 mb-10">Máte nápad na projekt? Napište mi.</p>
            <form action="https://formspree.io/f/VAŠE_FORMSPREE_ID" method="POST" class="bg-surface p-8 rounded-2xl border border-gray-800 shadow-lg" data-aos="fade-up">
                <div class="grid md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Jméno</label>
                        <input type="text" name="name" required class="w-full bg-dark border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Email</label>
                        <input type="email" name="email" required class="w-full bg-dark border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-primary">
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-sm text-gray-400 mb-2">Zpráva</label>
                    <textarea name="message" rows="4" required class="w-full bg-dark border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-primary"></textarea>
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-primary/25">
                    <span x-text="lang[currentLang].general.send"></span>
                </button>
            </form>
        </div>
    </section>

    <footer class="py-8 bg-dark border-t border-gray-800 text-center text-gray-500 text-sm">
        <p>&copy; 2024 Jan Novák. Built with Tailwind & Alpine.</p>
        <div class="flex justify-center gap-4 mt-4 mb-4">
            <a href="#" class="hover:text-white transition"><i class="fa-brands fa-github text-xl"></i></a>
            <a href="#" class="hover:text-white transition"><i class="fa-brands fa-linkedin text-xl"></i></a>
        </div>
        <a href="https://github.com/TVUJ_USER/TVUJ_REPO/edit/main/data.json" target="_blank" class="text-xs text-gray-700 hover:text-primary transition flex items-center justify-center gap-1">
            <i class="fa-solid fa-lock"></i> Admin (Edit Data)
        </a>
    </footer>

    <div x-show="modalOpen" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" style="display: none;" x-transition.opacity>
        <div class="bg-surface w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl relative border border-gray-700 max-h-[90vh] overflow-y-auto" @click.away="modalOpen = false">
            <button @click="modalOpen = false" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl z-10">&times;</button>
            <template x-if="selectedProject">
                <div class="flex flex-col md:flex-row">
                    <div class="md:w-1/2 h-64 md:h-auto relative">
                        <img :src="selectedProject.image" class="w-full h-full object-cover">
                    </div>
                    <div class="md:w-1/2 p-8">
                        <h3 class="text-2xl font-bold text-white mb-2" x-text="selectedProject.title[currentLang]"></h3>
                        <div class="mb-6 flex gap-2">
                             <span class="text-primary text-sm font-mono border border-primary/30 px-2 py-0.5 rounded" x-text="selectedProject.category.toUpperCase()"></span>
                        </div>
                        <div class="mb-6">
                            <h4 class="text-sm uppercase text-gray-500 font-bold mb-2">Zadání</h4>
                            <p class="text-gray-300 text-sm" x-text="selectedProject.brief[currentLang]"></p>
                        </div>
                        <div class="mb-6">
                            <h4 class="text-sm uppercase text-gray-500 font-bold mb-2">Řešení</h4>
                            <p class="text-gray-300 text-sm" x-text="selectedProject.desc[currentLang]"></p>
                        </div>
                        <div class="mb-8 bg-dark/50 p-4 rounded-lg border border-gray-700/50">
                            <h4 class="text-sm uppercase text-gray-500 font-bold mb-2">Recenze</h4>
                            <p class="text-gray-300 italic text-sm" x-text="selectedProject.review[currentLang]"></p>
                        </div>
                        <a :href="selectedProject.link" target="_blank" class="block w-full text-center bg-primary hover:bg-indigo-500 text-white py-3 rounded-lg font-semibold transition">
                            Online Náhled
                        </a>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, duration: 800 });

        function portfolioData() {
            return {
                currentLang: 'cs',
                activeTab: 'web',
                modalOpen: false,
                selectedProject: null,
                projects: [],
                reviews: [],

                // Načtení dat z externího souboru
                fetchData() {
                    fetch('./data.json')
                        .then(response => response.json())
                        .then(data => {
                            this.projects = data.projects;
                            this.reviews = data.reviews;
                        })
                        .catch(error => console.error('Chyba načítání dat:', error));
                },

                openModal(project) {
                    this.selectedProject = project;
                    this.modalOpen = true;
                },
                toggleLang() {
                    this.currentLang = this.currentLang === 'cs' ? 'en' : 'cs';
                },

                // Pevné texty rozhraní (menu atd.)
                skills: [
                    { name: 'HTML/CSS', icon: 'fa-brands fa-html5', level: 'Advanced' },
                    { name: 'JavaScript', icon: 'fa-brands fa-js', level: 'Intermediate' },
                    { name: 'Python', icon: 'fa-brands fa-python', level: 'Advanced' },
                    { name: 'C# / .NET', icon: 'fa-brands fa-microsoft', level: 'Intermediate' }
                ],
                lang: {
                    cs: {
                        nav: { home: 'Profil', skills: 'Co umím', pricing: 'Ceník', projects: 'Projekty', contact: 'Kontakt' },
                        hero: { greeting: 'Ahoj, já jsem', role: 'Full-Stack Vývojář', desc: 'Specializuji se na tvorbu moderních webů, automatizaci v Pythonu a C# aplikace.', cta_projects: 'Moje práce', cta_contact: 'Napište mi' },
                        titles: { skills: 'Technologie', pricing: 'Ceník Služeb', projects: 'Vybrané Projekty', reviews: 'Co říkají klienti', contact: 'Kontaktujte mě' },
                        general: { details: 'Více detailů', send: 'Odeslat zprávu' },
                        pricing: [
                            { title: 'Web Start', price: '5 000 Kč', features: ['One-page web', 'Responzivní design', 'Základní SEO'] },
                            { title: 'Aplikace', price: '15 000 Kč', features: ['Vlastní funkcionalita', 'Databáze', 'Admin sekce'] },
                            { title: 'Konzultace', price: '1 000 Kč/h', features: ['Code review', 'Návrh architektury', 'Mentoring'] }
                        ]
                    },
                    en: {
                        nav: { home: 'Profile', skills: 'Skills', pricing: 'Pricing', projects: 'Projects', contact: 'Contact' },
                        hero: { greeting: 'Hello, I am', role: 'Full-Stack Developer', desc: 'I specialize in modern web development, Python automation, and C# apps.', cta_projects: 'My Work', cta_contact: 'Contact Me' },
                        titles: { skills: 'Technologies', pricing: 'Pricing', projects: 'Selected Projects', reviews: 'Client Reviews', contact: 'Contact Me' },
                        general: { details: 'More Details', send: 'Send Message' },
                        pricing: [
                            { title: 'Web Start', price: '$200', features: ['One-page web', 'Responsive design', 'Basic SEO'] },
                            { title: 'Application', price: '$600', features: ['Custom functionality', 'Database', 'Admin section'] },
                            { title: 'Consulting', price: '$50/h', features: ['Code review', 'Architecture design', 'Mentoring'] }
                        ]
                    }
                }
            }
        }
    </script>
</body>
</html>
